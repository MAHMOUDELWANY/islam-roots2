<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Forest Green Badge Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A261D" />
      <stop offset="50%" stop-color="#141E17" />
      <stop offset="100%" stop-color="#0E1610" />
    </linearGradient>

    <!-- Subtle Emerald Gold Highlight Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D5943" />
      <stop offset="50%" stop-color="#8D5B28" />
      <stop offset="100%" stop-color="#243829" />
    </linearGradient>

    <!-- Crescent Soft Glow -->
    <radialGradient id="crescentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FAF4E8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#E8DCB8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E8DCB8" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Calligraphy Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#229954" />
      <stop offset="50%" stop-color="#1B8345" />
      <stop offset="100%" stop-color="#126332" />
    </linearGradient>

    <!-- Wood Roots Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2874C" />
      <stop offset="50%" stop-color="#A26B36" />
      <stop offset="100%" stop-color="#7F4E20" />
    </linearGradient>
  </defs>

  <!-- Dark Botanical Container Card -->
  <rect width="500" height="500" rx="80" fill="url(#badgeBg)" />
  <rect x="6" y="6" width="488" height="488" rx="74" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.8" />

  <!-- CRESCENT MOON & GLOW (TOP CENTER) -->
  <g id="crescent-group">
    <circle cx="250" cy="65" r="38" fill="url(#crescentGlow)" />
    <path d="M 238,46 A 22,22 0 1,0 264,72 A 17,17 0 1,1 238,46 Z" fill="#FAF5EB" opacity="0.95" />
  </g>

  <!-- ISLAM CALLIGRAPHY (EMERALD GREEN CURSIVE SCRIPT) -->
  <g id="islam-text" fill="url(#emeraldGrad)" stroke="url(#emeraldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 148,120 C 130,105 155,85 178,102 C 192,112 188,132 176,155 C 165,178 152,202 142,222 C 138,230 148,235 158,228 C 172,218 185,198 194,172 C 198,160 206,165 202,178 C 196,198 184,218 174,232 C 170,238 178,242 186,234" stroke-width="7" fill="none" />
    <path d="M 198,196 C 208,182 226,185 220,200 C 215,212 198,215 206,228 C 214,238 232,228 238,216" stroke-width="7" fill="none" />
    <path d="M 242,115 C 254,108 264,125 258,162 C 252,198 246,225 260,222 C 270,218 282,202 288,188" stroke-width="8" fill="none" />
    <path d="M 292,202 C 280,192 270,206 280,218 C 290,228 304,216 305,202 C 306,188 292,185 292,202 Z" stroke-width="5" fill="url(#emeraldGrad)" />
    <path d="M 302,202 C 308,215 314,226 324,222 C 330,218 335,208 340,195" stroke-width="7" fill="none" />
    <path d="M 342,195 C 350,185 362,188 358,205 C 354,220 350,228 360,224 C 368,218 378,192 388,190 C 398,188 402,202 398,218 C 394,232 408,228 418,212" stroke-width="7" fill="none" />
  </g>

  <!-- ROOTS CALLIGRAPHY & TWISTED TRUNK -->
  <g id="roots-text">
    <path d="M 110,258 C 115,235 142,228 162,242 C 180,256 166,288 140,288 L 122,288 M 122,235 L 114,352 C 112,368 130,364 138,352 M 140,288 C 154,316 172,346 192,358" fill="none" stroke="url(#emeraldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 198,310 C 184,294 182,338 202,338 C 222,338 220,294 198,310 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 302,292 C 288,276 286,320 306,320 C 324,320 322,278 302,292 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 362,245 L 354,338 C 352,356 370,354 382,338 M 342,282 L 382,278" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 392,322 C 400,298 426,302 418,322 C 410,342 436,344 442,322" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- BRAIDED TRUNK (CENTER FIGURE-8 LOOP CONNECTING TO ROOTS) -->
  <g id="central-trunk" fill="none" stroke="url(#woodGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 250,240 C 220,260 220,295 250,315 C 280,335 280,370 250,390 L 250,420" stroke-width="10" />
    <path d="M 250,240 C 280,260 280,295 250,315 C 220,335 220,370 250,390 L 250,420" stroke-width="10" />
    <path d="M 244,250 C 228,268 228,288 244,305" stroke-width="4" stroke="#D29A5C" />
    <path d="M 256,250 C 272,268 272,288 256,305" stroke-width="4" stroke="#D29A5C" />
  </g>

  <!-- SPREADING TREE ROOT SYSTEM WITH LEAVES (BOTTOM) -->
  <g id="spreading-roots">
    <g fill="none" stroke="url(#woodGrad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 250,415 C 215,430 160,442 110,475" stroke-width="11" />
      <path d="M 250,415 C 285,430 340,442 390,475" stroke-width="11" />
      <path d="M 250,425 C 190,445 130,460 70,495" stroke-width="9" />
      <path d="M 250,425 C 310,445 370,460 430,495" stroke-width="9" />
      <path d="M 250,435 C 220,455 175,475 135,508" stroke-width="7" />
      <path d="M 250,435 C 280,455 325,475 365,508" stroke-width="7" />
      <path d="M 180,440 C 145,460 110,478 78,510" stroke-width="5" />
      <path d="M 320,440 C 355,460 390,478 422,510" stroke-width="5" />
      <path d="M 130,455 C 100,472 70,490 42,518" stroke-width="4" />
      <path d="M 370,455 C 400,472 430,490 458,518" stroke-width="4" />
      <path d="M 210,465 C 180,488 152,508 128,522" stroke-width="4" />
      <path d="M 290,465 C 320,488 348,508 372,522" stroke-width="4" />
    </g>
    <g fill="url(#emeraldGrad)">
      <path d="M 105,472 C 95,465 90,475 102,482 C 108,485 112,478 105,472 Z" />
      <path d="M 72,492 C 60,486 58,498 70,504 C 76,506 80,498 72,492 Z" />
      <path d="M 142,452 C 132,444 128,456 138,462 C 145,465 148,456 142,452 Z" />
      <path d="M 175,432 C 165,425 160,435 172,440 C 178,442 180,435 175,432 Z" />
      <path d="M 395,472 C 405,465 410,475 398,482 C 392,485 388,478 395,472 Z" />
      <path d="M 428,492 C 440,486 442,498 430,504 C 424,506 420,498 428,492 Z" />
      <path d="M 358,452 C 368,444 372,456 362,462 C 355,465 352,456 358,452 Z" />
      <path d="M 325,432 C 335,425 340,435 328,440 C 322,442 320,435 325,432 Z" />
    </g>
  </g>
</svg>
