<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A261D" />
      <stop offset="100%" stop-color="#0E1610" />
    </linearGradient>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E8DCB8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Botanical Container Card -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#2D3F30" stroke-width="1.5" />

  <!-- Crescent Moon at Top -->
  <circle cx="64" cy="22" r="12" fill="url(#favGlow)" />
  <path d="M 60,16 A 7,7 0 1,0 69,25 A 5.5,5.5 0 1,1 60,16 Z" fill="#FAF5EB" />

  <!-- Simplified Emerald 'Islam Roots' Symbol (Calligraphy Loop & Tree Trunk) -->
  <g fill="none" stroke="#229954" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38,48 C 32,40 48,36 56,44 C 64,52 48,68 38,72 M 38,36 L 36,88 M 46,62 L 68,60" stroke-width="4" />
    <path d="M 72,56 C 80,48 94,52 90,64 C 86,76 70,78 80,88 C 88,96 102,88 106,78" stroke-width="4" />
  </g>

  <!-- Wood Trunk Loop -->
  <path d="M 64,58 C 55,68 55,80 64,88 C 73,96 73,108 64,116" fill="none" stroke="#A26B36" stroke-width="4" stroke-linecap="round" />

  <!-- Spreading Roots at Bottom -->
  <g fill="none" stroke="#A26B36" stroke-linecap="round" stroke-width="3">
    <path d="M 64,110 C 50,116 32,120 18,124" />
    <path d="M 64,110 C 78,116 96,120 110,124" />
    <path d="M 64,114 C 44,120 28,124 12,126" />
    <path d="M 64,114 C 84,120 100,124 116,126" />
  </g>

  <!-- Leaf Accents -->
  <g fill="#229954">
    <circle cx="20" cy="122" r="2.5" />
    <circle cx="108" cy="122" r="2.5" />
    <circle cx="34" cy="118" r="2" />
    <circle cx="94" cy="118" r="2" />
  </g>
</svg>
